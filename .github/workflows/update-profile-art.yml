name: Update profile art

"on":
  # GitHub cannot trigger this profile workflow when another repository
  # receives a contribution, so poll the public calendar every 15 minutes.
  # The offset avoids the busiest top-of-hour scheduling window.
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}
  push: # Refresh immediately when this profile repository changes.
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python scripts/fetch_contributions.py
        env:
          # Count the auto-commit this run is about to publish.
          INCLUDE_REFRESH_COMMIT: "1"
      - run: python scripts/render_heatmap_svg.py
      # Self-hosted replacements for the github-readme-stats widgets, whose
      # shared public instances kept rate-limiting into broken cards.
      - run: python scripts/fetch_github_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/render_stats_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # The refreshed timestamp makes each successful run produce one commit.
          commit_message: "chore: refresh contribution graph [skip ci]"
          commit_user_name: "Borna Afraz"
          commit_user_email: "bornaboyafraz@gmail.com"
          commit_author: "Borna Afraz <bornaboyafraz@gmail.com>"
          file_pattern: >-
            data/contributions.json contrib-heatmap.svg
            data/github-stats.json stats-card.svg top-langs.svg
